[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scalpx"
version = "1.0.0"
description = "Binance USDⓈ-M perpetual ultra-short-term trading system: event-driven, backtest/live parity, zero core dependencies"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []           # 核心零第三方依赖（仅标准库）

[project.optional-dependencies]
ws = ["websockets>=12.0"]   # 实盘 WebSocket 行情/用户数据流
dev = ["ruff>=0.6", "mypy>=1.10"]

[project.scripts]
scalpx = "scalpx.cli:main"

[tool.setuptools.packages.find]
include = ["scalpx*"]

[tool.setuptools.package-data]
"scalpx.web" = ["static/*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
